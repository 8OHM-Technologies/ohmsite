services:
  # ---------------------------------------------------------
  # Laravel PHP Application
  # ---------------------------------------------------------
  app:
    image: ghcr.io/8ohm-technologies/ohmsite-app:latest
    container_name: ohmsite-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - ./storage:/var/www/storage
      - ./docker/php-fpm/custom.conf:/usr/local/etc/php-fpm.d/zz-custom.conf:ro
    networks:
      - 8ohm-network

  # ---------------------------------------------------------
  # Nginx Web Server
  # ---------------------------------------------------------
  web:
    image: ghcr.io/8ohm-technologies/ohmsite-web:latest
    container_name: ohmsite-web
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./storage:/var/www/storage
    networks:
      - 8ohm-network
    depends_on:
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ohmsite.rule=Host(`8ohm.co.za`)"
      - "traefik.http.routers.ohmsite.entrypoints=websecure"
      - "traefik.http.routers.ohmsite.tls=true"
      - "traefik.http.services.ohmsite.loadbalancer.server.port=80"
      - "traefik.docker.network=8ohm-network"
      - "traefik.http.routers.ohmsite-www.rule=Host(`www.8ohm.co.za`)"
      - "traefik.http.routers.ohmsite-www.entrypoints=websecure"
      - "traefik.http.routers.ohmsite-www.tls=true"
      - "traefik.http.routers.ohmsite-www.middlewares=ohmsite-redirect-www"
      - "traefik.http.middlewares.ohmsite-redirect-www.redirectregex.regex=^https?://www.8ohm.co.za/(.*)"
      - "traefik.http.middlewares.ohmsite-redirect-www.redirectregex.replacement=https://8ohm.co.za/$${1}"
      - "traefik.http.middlewares.ohmsite-redirect-www.redirectregex.permanent=true"

networks:
  8ohm-network:
    external: true
